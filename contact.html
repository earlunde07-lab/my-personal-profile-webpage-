<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Earl Keith C. Unde</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        (function() {
            emailjs.init({
                publicKey: "qsp42UqHdpTjw9Ws5"
            });
        })();
    </script>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Introductions</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="hobbies.html">My Hobbies</a></li>
            <li><a href="favorites.html">My Favorites</a></li>
            <li><a href="goals.html">My Goals</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>

    <header class="page-header">
        <h1 id="main-header">Contact Me</h1>
    </header>

    <main>
        
        <section class="content-card">
            <h2 class="section-title">Send Me a Message</h2>
            <p class="profile-info">Please fill out the form below to send me a message.</p>

            <form id="contact-form" class="contact-form">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label>Gender:</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label><br>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label><br>

                    <input type="radio" id="gay" name="gender" value="Gay">
                    <label for="gay">Gay</label><br>

                    <input type="radio" id="lesbian" name="gender" value="Lesbian">
                    <label for="lesbian">Lesbian</label><br>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </div>

                <label>Skills:</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="html" name="skills" value="HTML">
                    <label for="html">HTML</label><br>

                    <input type="checkbox" id="css" name="skills" value="CSS">
                    <label for="css">CSS</label><br>

                    <input type="checkbox" id="js" name="skills" value="JavaScript">
                    <label for="js">JavaScript</label>
                </div>

                <label for="strand">Strand:</label>
                <select id="strand" name="strand" required>
                    <option value="">Select Strand</option>
                    <option value="ICT">ICT</option>
                    <option value="STEM">STEM</option>
                    <option value="ABM">ABM</option>
                    <option value="GAS">GAS</option>
                    <option value="HUMSS">HUMSS</option>
                </select>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>

                <div class="button-group">
                    <button type="submit" class="btn-submit">Send Message</button>
                    <button type="reset" class="btn-reset">Clear Form</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Earl Keith C. Unde. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById("contact-form")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                emailjs.sendForm(
                    "service_inuf5cc",
                    "template_jyf4gdn",
                    this
                )
                .then(function() {
                    alert("Message sent successfully!");
                    document.getElementById("contact-form").reset();
                })
                .catch(function(error) {
                    alert("Message failed to send. Please try again.");
                    console.error("EmailJS Error:", error);
                });
            });
    </script>

</body>
</html>
